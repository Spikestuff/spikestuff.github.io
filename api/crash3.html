<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Bandicoot: Warped Recent PBs</title>
    <style>
        body {
            font-family: monospace;
            color: #B0AF9D;
            margin: 0;
            padding: 4px;
        }
        .container-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .category-container {
            flex: 1;
            white-space: nowrap;
            text-align: center;
        }
        .separator {
            font-weight: bold;
            padding: 0 10px;
        }
    </style>
</head>
<body>
<div class="container-wrapper"></div>
<script>
    // https://github.com/speedruncomorg/api/tree/master/version1
    // https://www.speedrun.com/api/v1/games/crash3/categories

    const gameid = '29d37g6l';
    
    const categories = [
        { id: 'gjdregk6', name: 'any%' },
        { id: 'r02qpjdy', name: '105%' },
        { id: 'zjdz73kv', name: 'any% (box glitch)' }
    ];

    async function fetchAndDisplayRun(category) {
        let container = document.getElementById(category.id);
        const isNew = !container;

        if (isNew) {
            container = document.createElement('div');
            container.classList.add('category-container');
            container.id = category.id;
            const containerWrapper = document.querySelector('.container-wrapper');
            containerWrapper.appendChild(container);

            if (category !== categories[categories.length - 1]) {
                const separator = document.createElement('div');
                separator.classList.add('separator');
                separator.textContent = '||';
                containerWrapper.appendChild(separator);
            }
        }
        
        try {
            const response = await fetch(`https://www.speedrun.com/api/v1/runs?game=${gameid}&category=${category.id}&orderby=submitted&direction=desc&max=1`);
            const data = await response.json();
            const runData = data.data;
            
            if (runData && runData.length) {
                const run = runData[0];
                const player = await fetch(`https://www.speedrun.com/api/v1/users/${run.players[0].id}`).then(res => res.json());

                const playerName = player.data.names.international;
                const categoryName = category.name;
                const runTime = run.times.primary_t;
                
                const hours = Math.floor(runTime / 3600);
                const minutes = String(Math.floor((runTime % 3600) / 60)).padStart(2, '0');
                const seconds = String(Math.round(runTime % 60)).padStart(2, '0');

                let formattedTime;
                if (hours > 0) {
                    formattedTime = `${hours}:${minutes}:${seconds}`;
                } else {
                    formattedTime = `${minutes}:${seconds}`;
                }

                container.innerHTML = `
                    <p>Congrats <b>${playerName}</b> for your <b>${formattedTime}</b> PB in <b>${categoryName}</b>!</p>
                `;
            }
        } catch (error) {}
    }

    async function updateAllRuns() {
        await Promise.all(categories.map(fetchAndDisplayRun));
    }

    updateAllRuns();
    setInterval(updateAllRuns, 5 * 60 * 1000);
	//setInterval(updateAllRuns, 60000);
</script>
</body>
</html>
